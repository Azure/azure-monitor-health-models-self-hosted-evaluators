global:
  scrape_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: checkout
    static_configs:
      - targets: ['127.0.0.1:8080']
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'http_requests_total|http_request_duration_seconds_(bucket|sum|count)|checkout_last_request_timestamp_seconds'
        action: keep

remote_write:
  - url: '__METRICS_INGESTION_ENDPOINT__'
    azuread:
      cloud: AzurePublic
      managed_identity:
        client_id: '__IDENTITY_CLIENT_ID__'
    write_relabel_configs:
      - source_labels: [__name__]
        regex: 'http_requests_total|http_request_duration_seconds_(bucket|sum|count)|checkout_last_request_timestamp_seconds|up'
        action: keep
